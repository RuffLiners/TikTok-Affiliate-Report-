<title>Affiliate Pulse</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    color-scheme: light;
    --bg: #f7f6f3;            /* page plane */
    --surface: #fcfcfb;       /* cards / chart surface */
    --surface-2: #f0efec;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --baseline: #c3c2b7;
    --border: rgba(11,11,11,0.10);
    --accent: #1c5cab;
    --accent-soft: #cde2fb;
    --s1: #2a78d6;            /* series: Emerging */
    --s2: #eb6834;            /* series: Established */
    --s3: #1baf7a;            /* series: Power */
    --seq-a: #86b6ef; --seq-b: #6da7ec; --seq-c: #5598e7; --seq-d: #3987e5;
    --seq-e: #2a78d6; --seq-f: #1c5cab; --seq-g: #104281;
    --up: #006300;
    --down: #d03b3b;
    --warn: #b97900;
    --shadow: 0 1px 2px rgba(11,11,11,0.05), 0 4px 16px rgba(11,11,11,0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0d0d0d;
      --surface: #1a1a19;
      --surface-2: #242422;
      --ink: #ffffff;
      --ink-2: #c3c2b7;
      --muted: #898781;
      --grid: #2c2c2a;
      --baseline: #383835;
      --border: rgba(255,255,255,0.10);
      --accent: #3987e5;
      --accent-soft: #10315c;
      --s1: #3987e5; --s2: #d95926; --s3: #199e70;
      --seq-a: #9ec5f4; --seq-b: #86b6ef; --seq-c: #5598e7; --seq-d: #3987e5;
      --seq-e: #2a78d6; --seq-f: #256abf; --seq-g: #184f95;
      --up: #0ca30c;
      --down: #e66767;
      --warn: #fab219;
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0d0d0d;
    --surface: #1a1a19;
    --surface-2: #242422;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --baseline: #383835;
    --border: rgba(255,255,255,0.10);
    --accent: #3987e5;
    --accent-soft: #10315c;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70;
    --seq-a: #9ec5f4; --seq-b: #86b6ef; --seq-c: #5598e7; --seq-d: #3987e5;
    --seq-e: #2a78d6; --seq-f: #256abf; --seq-g: #184f95;
    --up: #0ca30c;
    --down: #e66767;
    --warn: #fab219;
    --shadow: none;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 20px 72px; }

  h1, h2, h3, .fig { font-family: "Archivo", "IBM Plex Sans", system-ui, sans-serif; }
  h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
  h2 { font-size: 15px; font-weight: 700; margin: 0 0 2px; }
  .sub { color: var(--ink-2); font-size: 13px; }
  .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

  /* ---------- header ---------- */
  header.bar {
    display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: flex-end;
    justify-content: space-between; margin-bottom: 20px;
  }
  .brandline { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  #brandName { color: var(--accent); }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  select, button.btn {
    font: inherit; font-weight: 500; color: var(--ink);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 10px; cursor: pointer;
  }
  select:focus-visible, button:focus-visible, a:focus-visible, summary:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  button.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.btn[disabled] { opacity: 0.5; cursor: default; }

  /* ---------- layout ---------- */
  section { margin-top: 26px; }
  .cards { display: grid; gap: 12px; }
  .kpis { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px 16px; box-shadow: var(--shadow);
  }
  .kpi .lbl { font-size: 12px; color: var(--ink-2); }
  .kpi .fig { font-size: 24px; font-weight: 800; letter-spacing: -0.01em; line-height: 1.15; margin: 2px 0; }
  .delta { font-size: 12px; font-weight: 600; }
  .delta.up { color: var(--up); }
  .delta.down { color: var(--down); }
  .delta.flat { color: var(--muted); }

  .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .multis { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
  @media (max-width: 760px) { .duo { grid-template-columns: 1fr; } }

  .chart-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 6px; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); margin: 4px 0 8px; }
  .legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

  svg text { font-family: "IBM Plex Sans", system-ui, sans-serif; }

  /* ---------- tables ---------- */
  .tblwrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th {
    text-align: left; font-size: 11px; font-weight: 600; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--muted); padding: 6px 10px;
    border-bottom: 1px solid var(--baseline); white-space: nowrap;
  }
  td { padding: 7px 10px; border-bottom: 1px solid var(--grid); vertical-align: middle; white-space: nowrap; }
  tr:last-child td { border-bottom: none; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .handle { font-weight: 600; }
  .rankbar { display: inline-block; height: 6px; border-radius: 3px; background: var(--seq-e); vertical-align: middle; }

  /* ---------- funnel ---------- */
  .fun-row { display: grid; grid-template-columns: 150px 1fr 130px; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--grid); }
  .fun-row:last-child { border-bottom: none; }
  .fun-lbl { font-size: 13px; color: var(--ink-2); }
  .fun-bar-track { height: 14px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
  .fun-bar { height: 100%; border-radius: 4px; min-width: 3px; }
  .fun-val { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  .fun-val small { color: var(--muted); font-weight: 400; }

  /* ---------- insights ---------- */
  .insights li { margin: 6px 0; }
  .insights { margin: 8px 0 0; padding-left: 20px; }

  /* ---------- states ---------- */
  .state-card { max-width: 640px; margin: 48px auto; text-align: left; }
  .state-card h2 { font-size: 18px; }
  .state-card ol { padding-left: 20px; }
  .state-card li { margin: 8px 0; }
  code { background: var(--surface-2); border-radius: 4px; padding: 1px 5px; font-size: 12.5px; }
  .err {
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; font-size: 13px; color: var(--ink-2); margin-top: 8px;
  }
  .err b { color: var(--ink); }
  .skel { position: relative; overflow: hidden; background: var(--surface-2); border-radius: 8px; min-height: 90px; }
  @media (prefers-reduced-motion: no-preference) {
    .skel::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent, rgba(137,135,129,0.15), transparent);
      animation: shimmer 1.4s infinite;
    }
    @keyframes shimmer { from { transform: translateX(-100%);} to { transform: translateX(100%);} }
  }
  .note { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .statuschip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600;
    border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px; }

  /* ---------- tooltip ---------- */
  #tip {
    position: fixed; z-index: 50; pointer-events: none; display: none;
    background: var(--ink); color: var(--bg); border-radius: 8px;
    padding: 6px 10px; font-size: 12px; line-height: 1.45; max-width: 260px; white-space: nowrap;
  }
  #tip .t-head { font-weight: 600; }

  details.about { margin-top: 40px; color: var(--ink-2); }
  details.about summary { cursor: pointer; font-weight: 600; color: var(--ink); }
  details.about .card { margin-top: 10px; }
  footer.pagefoot { margin-top: 28px; font-size: 12px; color: var(--muted); }
</style>

<div class="wrap">
  <div id="app"></div>
  <div id="tip" role="status"></div>
</div>

<script>
"use strict";
/* =====================================================================
   Affiliate Pulse — weekly TikTok Shop affiliate growth report.
   Reads the viewer's own Euka connector via the artifact `mcp`
   capability. No data is stored or sent anywhere else.
   ===================================================================== */

const SERVER_ALIASES = ["Euka", "https_app_euka_ai_api_mcp", "https app euka ai api mcp"];
const T = {
  brands:   "list_accessible_brands",
  overview: "get_dashboard_performance_overview",
  levels:   "get_dashboard_creator_level_breakdown",
  topCreators: "get_dashboard_top_creators_by_gmv",
  topVideos:   "get_dashboard_top_videos_by_revenue",
  funnel:   "get_dashboard_creator_outreach_funnel",
  retention:"get_creator_retention_summary",
};
const SEGMENTS = [
  { key: "emerging",    label: "Emerging (< $25K)",          levels: ["L1","L2"],      colorVar: "--s1" },
  { key: "established", label: "Established ($25K–$150K)",   levels: ["L3","L4"],      colorVar: "--s2" },
  { key: "power",       label: "Power ($150K+)",             levels: ["L5","L6","L7"], colorVar: "--s3" },
];
const SEQ = ["--seq-a","--seq-b","--seq-c","--seq-d","--seq-e","--seq-f","--seq-g"];

let mcp = null, SERVER = null, BRANDS = [], state = {
  brandId: null, weekEnd: null, trendN: 8, running: false,
};

/* ---------------- helpers ---------------- */
const $ = (sel, el) => (el || document).querySelector(sel);
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function store(key, val) { try { localStorage.setItem("ap." + key, JSON.stringify(val)); } catch (e) {} }
function recall(key) { try { const v = localStorage.getItem("ap." + key); return v == null ? null : JSON.parse(v); } catch (e) { return null; } }

function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function iso(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function fromIso(s) { const [y, m, dd] = s.split("-").map(Number); return new Date(y, m - 1, dd); }
function mdy(s) { const d = fromIso(s); return (d.getMonth() + 1) + "/" + d.getDate(); }
function rangeLabel(w) {
  const a = fromIso(w.start), b = fromIso(w.end);
  const f = d => d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
  return f(a) + " – " + f(b) + ", " + b.getFullYear();
}
/* Most recent complete Sun–Sat week ending at least 2 days ago (attribution lag). */
function latestCompleteWeekEnd() {
  const anchor = addDays(new Date(), -2);
  return addDays(anchor, -((anchor.getDay() + 1) % 7)); // back to Saturday
}
function weekFor(endDate) { return { start: iso(addDays(endDate, -6)), end: iso(endDate) }; }
function trailingWeeks(endDate, n) {
  const out = [];
  for (let i = n - 1; i >= 0; i--) out.push(weekFor(addDays(endDate, -7 * i)));
  return out;
}

const fmtInt = n => n == null ? "—" : Math.round(n).toLocaleString();
function fmtMoney(n, compact) {
  if (n == null) return "—";
  if (compact && Math.abs(n) >= 10000) {
    return "$" + (n / 1000).toLocaleString(undefined, { maximumFractionDigits: Math.abs(n) >= 100000 ? 0 : 1 }) + "K";
  }
  return "$" + Math.round(n).toLocaleString();
}
const fmtNum = n => {
  if (n == null) return "—";
  if (Math.abs(n) >= 1e6) return (n / 1e6).toFixed(1) + "M";
  if (Math.abs(n) >= 1e4) return Math.round(n / 1e3) + "K";
  return Math.round(n).toLocaleString();
};
function deltaHtml(pct) {
  if (pct == null || !isFinite(pct)) return '<span class="delta flat">— vs prior wk</span>';
  const cls = pct > 0.05 ? "up" : pct < -0.05 ? "down" : "flat";
  const arrow = cls === "up" ? "▲" : cls === "down" ? "▼" : "◦";
  return '<span class="delta ' + cls + '">' + arrow + " " + Math.abs(pct).toFixed(1) + "% vs prior wk</span>";
}

/* one retry for errors stamped retryable */
async function call(tool, input, opts) {
  const options = Object.assign({ cache: { staleTime: 300000, gcTime: 86400000 } }, opts || {});
  try {
    return await mcp.callTool(SERVER, tool, input, options);
  } catch (e) {
    if (e && e.retryable) {
      await new Promise(r => setTimeout(r, (e.retryAfterMs || 900) + Math.random() * 600));
      return mcp.callTool(SERVER, tool, input, options);
    }
    throw e;
  }
}
async function pool(tasks, limit) {
  const results = new Array(tasks.length); let i = 0;
  async function worker() {
    while (i < tasks.length) {
      const idx = i++;
      try { results[idx] = { ok: true, val: await tasks[idx]() }; }
      catch (e) { results[idx] = { ok: false, err: e }; }
    }
  }
  await Promise.all(Array.from({ length: Math.min(limit, tasks.length) }, worker));
  return results;
}

function errCopy(e) {
  const code = e && e.code;
  switch (code) {
    case "needs_reauth": return "Your Euka connection has expired. Reconnect it in claude.ai → Settings → Connectors, then reload this page.";
    case "server_not_connected": return "No Euka connector found. Add it in claude.ai → Settings → Connectors (see setup below).";
    case "selection_required": return "You have more than one connector with this name — pick one when claude.ai prompts you, or remove the duplicate, then reload.";
    case "not_in_manifest": return "This page isn't authorized for that Euka tool. Reload the page and accept the connector prompt.";
    case "blocked_by_policy": return "Your organization's policy blocks this Euka tool for your account.";
    case "approval_required": return "Your organization requires per-call approval for this tool, which artifacts can't request yet.";
    case "server_unavailable": return "Euka didn't respond. It may be briefly down — use Refresh to try again.";
    case "tool_error": return "Euka reported an error for this request" + (e.message ? ": " + e.message : ".");
    case "not_granted": case "capability_disabled": case "capability_removed":
      return "This view can't reach your connectors. Open the artifact directly in claude.ai and allow connector access when prompted.";
    default: return "This section couldn't load" + (e && e.message ? " (" + e.message + ")" : "") + ". Use Refresh to try again.";
  }
}
function errBox(e, what) {
  return '<div class="err"><b>' + esc(what) + ":</b> " + esc(errCopy(e)) + "</div>";
}

/* ---------------- tooltip ---------------- */
const tip = () => $("#tip");
function bindTips(root) {
  root.querySelectorAll("[data-tip]").forEach(el => {
    el.addEventListener("mouseenter", () => { tip().innerHTML = el.dataset.tip; tip().style.display = "block"; });
    el.addEventListener("mousemove", ev => {
      const t = tip(); const pad = 14;
      let x = ev.clientX + pad, y = ev.clientY + pad;
      const r = t.getBoundingClientRect();
      if (x + r.width > innerWidth - 8) x = ev.clientX - r.width - pad;
      if (y + r.height > innerHeight - 8) y = ev.clientY - r.height - pad;
      t.style.left = x + "px"; t.style.top = y + "px";
    });
    el.addEventListener("mouseleave", () => { tip().style.display = "none"; });
  });
}

/* ---------------- SVG charts ---------------- */
function roundTopRect(x, y, w, h, r) {
  if (h <= 0) return "";
  r = Math.min(r, h, w / 2);
  return "M" + x + "," + (y + h) + " v" + (-(h - r)) + " q0,-" + r + " " + r + ",-" + r +
         " h" + (w - 2 * r) + " q" + r + ",0 " + r + "," + r + " v" + (h - r) + " z";
}
function gridLines(w, padL, padR, innerH, padT, steps) {
  let s = "";
  for (let i = 0; i <= steps; i++) {
    const y = padT + innerH - (innerH * i / steps);
    s += '<line x1="' + padL + '" x2="' + (w - padR) + '" y1="' + y + '" y2="' + y +
         '" stroke="' + (i === 0 ? css("--baseline") : css("--grid")) + '" stroke-width="1"/>';
  }
  return s;
}
/* single-series bar tile; values may contain nulls (missing weeks) */
function barTile(labels, values, fmt, tipName) {
  const W = 320, H = 120, padL = 6, padR = 6, padT = 8, padB = 18;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const max = Math.max(1, ...values.filter(v => v != null));
  const n = labels.length, slot = innerW / n, bw = Math.max(6, Math.min(26, slot - 4));
  let bars = "", labs = "";
  const every = n > 8 ? 2 : 1;
  labels.forEach((lb, i) => {
    const x = padL + slot * i + (slot - bw) / 2;
    const v = values[i];
    if (v != null) {
      const h = Math.max(v > 0 ? 2 : 0, innerH * v / max);
      bars += '<path d="' + roundTopRect(x, padT + innerH - h, bw, h, 4) + '" fill="' + css("--seq-e") + '"/>';
    } else {
      bars += '<rect x="' + x + '" y="' + (padT + innerH - 2) + '" width="' + bw + '" height="2" fill="' + css("--grid") + '"/>';
    }
    bars += '<rect x="' + (padL + slot * i) + '" y="' + padT + '" width="' + slot + '" height="' + innerH +
            '" fill="transparent" data-tip="<div class=\'t-head\'>Wk ending ' + lb + "</div>" + tipName + ": " +
            (v == null ? "unavailable" : fmt(v)) + '"/>';
    if (i % every === 0) labs += '<text x="' + (padL + slot * i + slot / 2) + '" y="' + (H - 4) +
      '" font-size="10" fill="' + css("--muted") + '" text-anchor="middle">' + lb + "</text>";
  });
  return '<svg viewBox="0 0 ' + W + " " + H + '" width="100%" role="img" aria-label="' + tipName + ' by week">' +
         gridLines(W, padL, padR, innerH, padT, 2) + bars + labs + "</svg>";
}
/* stacked 3-segment weekly bars with 2px gaps */
function stackedChart(labels, seriesArr) {
  const W = 720, H = 240, padL = 8, padR = 8, padT = 10, padB = 20;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const n = labels.length;
  const totals = labels.map((_, i) => seriesArr.reduce((a, s) => a + (s.values[i] || 0), 0));
  const max = Math.max(1, ...totals);
  const slot = innerW / n, bw = Math.max(10, Math.min(44, slot - 8));
  let out = "", labs = "";
  const every = n > 9 ? 2 : 1;
  labels.forEach((lb, i) => {
    const x = padL + slot * i + (slot - bw) / 2;
    let yCursor = padT + innerH;
    const parts = seriesArr.map(s => ({ label: s.label, v: s.values[i] || 0, color: css(s.colorVar) }));
    const visible = parts.filter(p => p.v > 0);
    visible.forEach((p, idx) => {
      const h = Math.max(2, innerH * p.v / max) - (idx < visible.length - 1 ? 2 : 0); /* 2px surface gap */
      const isTop = idx === visible.length - 1;
      const y = yCursor - h;
      out += isTop
        ? '<path d="' + roundTopRect(x, y, bw, h, 4) + '" fill="' + p.color + '"/>'
        : '<rect x="' + x + '" y="' + y + '" width="' + bw + '" height="' + h + '" fill="' + p.color + '"/>';
      yCursor = y - 2;
    });
    const rows = parts.map(p => p.label.split(" (")[0] + ": " + fmtMoney(p.v, true)).join("<br>");
    out += '<rect x="' + (padL + slot * i) + '" y="' + padT + '" width="' + slot + '" height="' + innerH +
           '" fill="transparent" data-tip="<div class=\'t-head\'>Wk ending ' + lb + " · " + fmtMoney(totals[i], true) + "</div>" + rows + '"/>';
    if (i % every === 0) labs += '<text x="' + (padL + slot * i + slot / 2) + '" y="' + (H - 5) +
      '" font-size="10" fill="' + css("--muted") + '" text-anchor="middle">' + lb + "</text>";
    if (totals[i] > 0 && (n <= 9 || i % every === 0)) {
      labs += '<text x="' + (padL + slot * i + slot / 2) + '" y="' + (padT + innerH - innerH * totals[i] / max - 5) +
        '" font-size="10" font-weight="600" fill="' + css("--ink-2") + '" text-anchor="middle">' + fmtMoney(totals[i], true) + "</text>";
    }
  });
  return '<svg viewBox="0 0 ' + W + " " + H + '" width="100%" role="img" aria-label="Affiliate GMV by creator segment per week">' +
         gridLines(W, padL, padR, innerH, padT, 3) + out + labs + "</svg>";
}
function lineTile(labels, values, fmt, tipName) {
  const W = 320, H = 120, padL = 6, padR = 10, padT = 10, padB = 18;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const pts = values.map(v => v).filter(v => v != null);
  const max = Math.max(1, ...pts), min = Math.min(0, ...pts);
  const n = labels.length, slot = innerW / Math.max(1, n - 1);
  const xy = values.map((v, i) => v == null ? null :
    [padL + slot * i, padT + innerH - innerH * (v - min) / (max - min || 1)]);
  let path = "", started = false;
  xy.forEach(p => { if (!p) { started = false; return; } path += (started ? "L" : "M") + p[0] + "," + p[1]; started = true; });
  let dots = "", hits = "", labs = "";
  const every = n > 8 ? 2 : 1;
  xy.forEach((p, i) => {
    if (p) {
      const last = i === n - 1;
      dots += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="' + (last ? 4 : 2.5) + '" fill="' + css("--seq-e") + '"' +
              (last ? ' stroke="' + css("--surface") + '" stroke-width="2"' : "") + "/>";
    }
    hits += '<rect x="' + (padL + slot * i - slot / 2) + '" y="0" width="' + slot + '" height="' + H +
            '" fill="transparent" data-tip="<div class=\'t-head\'>Wk ending ' + labels[i] + "</div>" + tipName + ": " +
            (values[i] == null ? "unavailable" : fmt(values[i])) + '"/>';
    if (i % every === 0) labs += '<text x="' + (padL + slot * i) + '" y="' + (H - 4) +
      '" font-size="10" fill="' + css("--muted") + '" text-anchor="middle">' + labels[i] + "</text>";
  });
  return '<svg viewBox="0 0 ' + W + " " + H + '" width="100%" role="img" aria-label="' + tipName + ' by week">' +
         gridLines(W, padL, padR, innerH, padT, 2) +
         '<path d="' + path + '" fill="none" stroke="' + css("--seq-e") + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
         dots + hits + labs + "</svg>";
}

/* ---------------- report rendering ---------------- */
function skeletonHtml() {
  return ['kpis','trend','segments','funnel','tables','insights'].map(id =>
    '<section id="sec-' + id + '"><div class="skel"></div></section>').join("");
}

async function runReport() {
  if (!state.running) state.running = true; else return;
  const btn = $("#refreshBtn"); if (btn) btn.disabled = true;
  $("#report").innerHTML = skeletonHtml();
  const week = weekFor(fromIso(state.weekEnd));
  $("#weekLabel").textContent = "Week of " + rangeLabel(week) + " · vs the week before";
  const weeks = trailingWeeks(fromIso(state.weekEnd), state.trendN);
  const labels = weeks.map(w => mdy(w.end));
  const brandId = state.brandId;
  const isLatest = state.weekEnd === iso(latestCompleteWeekEnd());

  const tasks = [];
  const idx = {};
  weeks.forEach((w, i) => {
    idx["ov" + i] = tasks.length;
    tasks.push(() => call(T.overview, { brandId, startDate: w.start, endDate: w.end },
      (i === weeks.length - 1 && isLatest) ? { cache: { staleTime: 0, gcTime: 86400000, refresh: state.forceFresh } } : undefined));
    idx["lv" + i] = tasks.length;
    tasks.push(() => call(T.levels, { brandId, postedDateRange: { start: w.start, end: w.end } }));
  });
  idx.creators = tasks.length; tasks.push(() => call(T.topCreators, { brandId, postedDateRange: { start: week.start, end: week.end }, limit: 10 }));
  idx.videos = tasks.length; tasks.push(() => call(T.topVideos, { brandId, filter: { postedDateRange: { start: week.start, end: week.end } } }));
  idx.funnel = tasks.length; tasks.push(() => call(T.funnel, { brandId, postedDateRange: { start: week.start, end: week.end } }));
  idx.retention = tasks.length; tasks.push(() => call(T.retention, { brandId, startDate: week.start, endDate: week.end }));

  const res = await pool(tasks, 4);
  state.forceFresh = false;
  const pay = k => res[idx[k]] && res[idx[k]].ok ? res[idx[k]].val.payload : null;
  const err = k => res[idx[k]] && !res[idx[k]].ok ? res[idx[k]].err : null;

  /* page-level condition: everything failed with the same code */
  const fails = res.filter(r => !r.ok);
  if (fails.length === res.length && fails.length) {
    const code = fails[0].err && fails[0].err.code;
    if (fails.every(f => (f.err && f.err.code) === code)) {
      if (code === "needs_reauth") return showState("reauth", SERVER);
      $("#report").innerHTML = '<div class="card state-card"><h2>Couldn’t load the report</h2><p>' +
        esc(errCopy(fails[0].err)) + "</p></div>";
      finishRun(); return;
    }
  }

  const ovs = weeks.map((_, i) => pay("ov" + i));
  const lvs = weeks.map((_, i) => pay("lv" + i));
  const cur = ovs[ovs.length - 1];
  const curErr = err("ov" + (weeks.length - 1));

  renderKpis(cur, curErr, pay("retention"));
  renderTrend(labels, ovs);
  renderSegments(labels, lvs, err("lv" + (weeks.length - 1)));
  renderFunnel(pay("funnel"), err("funnel"), pay("retention"), err("retention"));
  renderTables(pay("creators"), err("creators"), pay("videos"), err("videos"));
  renderInsights({ labels, ovs, lvs, funnel: pay("funnel"), retention: pay("retention") });
  bindTips($("#report"));
  finishRun();
}
function finishRun() {
  state.running = false;
  const btn = $("#refreshBtn"); if (btn) btn.disabled = false;
}

function segTotals(lv) {
  const bySeg = {};
  SEGMENTS.forEach(s => bySeg[s.key] = { gmv: 0, creators: 0, videos: 0 });
  (lv && lv.tiers || []).forEach(t => {
    const seg = SEGMENTS.find(s => s.levels.includes(t.tier));
    if (!seg) return;
    bySeg[seg.key].gmv += t.totalGmv || 0;
    bySeg[seg.key].creators += t.creators || 0;
    bySeg[seg.key].videos += t.videos || 0;
  });
  return bySeg;
}

      curLv.tiers.map((t, i) =>

/* Deterministic, data-derived observations — computed in the page, not AI-written. */
function renderInsights(d) {
  const el = $("#sec-insights");
  const notes = [];
  const cur = d.ovs[d.ovs.length - 1];
  const valid = d.ovs.filter(Boolean);
  if (cur && valid.length >= 3) {
    const prior = valid.slice(0, -1);
    const avg = prior.reduce((a, o) => a + (o.totalAffiliateGMV || 0), 0) / prior.length;
    if (avg > 0) {
      const vsAvg = (cur.totalAffiliateGMV - avg) / avg * 100;
      notes.push("Affiliate GMV of <b>" + fmtMoney(cur.totalAffiliateGMV, true) + "</b> is " +
        (vsAvg >= 0 ? "▲ " : "▼ ") + Math.abs(vsAvg).toFixed(0) + "% vs your trailing " + prior.length + "-week average (" + fmtMoney(avg, true) + ").");
    }
    const best = d.labels[d.ovs.reduce((bi, o, i) => (o && (!d.ovs[bi] || o.totalAffiliateGMV > d.ovs[bi].totalAffiliateGMV)) ? i : bi, 0)];
    notes.push("Best week in this window: <b>wk ending " + best + "</b>.");
  }
  if (cur && cur.allAccountVideoViewsDifference < -10 && cur.totalAffiliateGMVDifference > 0) {
    notes.push("Views fell " + Math.abs(cur.allAccountVideoViewsDifference).toFixed(0) +
      "% while GMV grew — usually a sign your creator mix is shifting toward audiences that convert, not a reach problem.");
  }
  const curLv = d.lvs[d.lvs.length - 1];
  if (curLv) {
    const segs = segTotals(curLv);
    const total = SEGMENTS.reduce((a, s) => a + segs[s.key].gmv, 0);
    if (total > 0) {
      const top = SEGMENTS.reduce((a, s) => segs[s.key].gmv > segs[a.key].gmv ? s : a, SEGMENTS[0]);
      const ts = segs[top.key];
      notes.push("<b>" + top.label + "</b> creators drove " + Math.round(100 * ts.gmv / total) + "% of segment GMV (" +
        fmtMoney(ts.gmv, true) + " from " + fmtInt(ts.creators) + " creators" +
        (ts.creators ? ", " + fmtMoney(ts.gmv / ts.creators) + "/creator" : "") + ").");
      const em = segs.emerging, pw = segs.power;
      if (pw.creators && em.creators && em.gmv > 0) {
        const mult = (pw.gmv / pw.creators) / (em.gmv / em.creators);
        if (isFinite(mult) && mult > 2) notes.push("A Power creator is worth ~<b>" + mult.toFixed(0) +
          "×</b> an Emerging one this week — weigh your outreach and sample mix accordingly.");
      }
    }
  }
  if (d.funnel && d.funnel.stages) {
    const posted = d.funnel.stages.find(s => s.key === "postedContent");
    const sold = d.funnel.stages.find(s => s.key === "droveSales");
    if (posted && sold && posted.value) {
      notes.push(fmtInt(sold.value) + " of " + fmtInt(posted.value) + " posting creators drove sales (" +
        (100 * sold.value / posted.value).toFixed(0) + "%) — the lever is usually more videos per proven creator, not just more creators.");
    }
  }
  if (d.retention && d.retention.current && d.retention.previous && d.retention.previous.retentionRate > 0) {
    const r = d.retention.current.retentionRate, p = d.retention.previous.retentionRate;
    if (r < p * 0.9) notes.push("Retention slipped to <b>" + (r * 100).toFixed(1) + "%</b> (from " + (p * 100).toFixed(1) +
      "%) — churned creators outpaced returns; consider a reactivation pass on recent high-GMV posters.");
  }
  el.innerHTML = notes.length
    ? '<div class="card"><h2>What the numbers say</h2><ul class="insights">' + notes.map(n => "<li>" + n + "</li>").join("") + "</ul>" +
      '<div class="note">Computed from this report’s data. For deeper analysis, ask Claude about any number with your Euka connector attached.</div></div>'
    : "";
}

/* ---------------- boot ---------------- */
async function boot() {
  $("#app").innerHTML = stateShell("Connecting…", '<div class="skel" style="min-height:60px"></div>');
  if (!window.claude || typeof window.claude.use !== "function") return showState("no-runtime");
  mcp = await claude.use("mcp");
  if (!mcp) return showState("no-runtime");
  let servers;
  try { servers = (await mcp.listTools()).servers || []; }
  catch (e) {
    if (e && (e.code === "not_granted" || e.code === "capability_disabled" || e.code === "capability_removed")) return showState("no-runtime");
    return showState("error", e);
  }
  const match = servers.find(s => s.tools && s.tools.length) || servers[0];
  if (!match) return showState("not-connected");
  if (match.authStatus === "needs_reauth") return showState("reauth", match.server);
  if (!match.tools || !match.tools.length) return showState("not-connected");
  SERVER = match.server;

  let brandsRes;
  try { brandsRes = await call(T.brands, {}); }
  catch (e) {
    if (e && e.code === "needs_reauth") return showState("reauth", SERVER);
    if (e && e.code === "server_not_connected") return showState("not-connected");
    return showState("error", e);
  }
  BRANDS = (brandsRes.payload && brandsRes.payload.result) || [];
  if (!BRANDS.length) return showState("error", { message: "Your Euka account has no accessible brands." });

  const remembered = recall("brand");
  state.brandId = BRANDS.some(b => b.brandId === remembered) ? remembered : BRANDS[0].brandId;
  state.trendN = [4, 8, 13].includes(recall("trendN")) ? recall("trendN") : 8;
  state.weekEnd = iso(latestCompleteWeekEnd());

  $("#app").innerHTML = shellHtml();
  wireControls();
  runReport();
}
function wireControls() {
  const bs = $("#brandSel");
  if (bs) bs.addEventListener("change", () => { state.brandId = bs.value; store("brand", bs.value);
    $("#brandName").textContent = currentBrand().brandName; runReport(); });
  $("#weekSel").addEventListener("change", ev => { state.weekEnd = ev.target.value; runReport(); });
  $("#trendSel").addEventListener("change", ev => { state.trendN = Number(ev.target.value); store("trendN", state.trendN); runReport(); });
  $("#refreshBtn").addEventListener("click", () => { state.forceFresh = true; runReport(); });
}
boot();
</script>
