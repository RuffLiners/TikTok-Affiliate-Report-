<title>Affiliate Pulse</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root {

    --accent-soft: #cde2fb;

    --seq-e: #2a78d6; --seq-f: #1c5cab; --seq-g: #104281;
    --up: #006300;
    --down: #d03b3b;
    --warn: #b97900;

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0d0d0d; --surface: #1a1a19; --surface-2: #242422;
      --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --baseline: #383835; --border: rgba(255,255,255,0.10);
      --accent: #3987e5; --accent-soft: #10315c;
      --s1: #3987e5; --s2: #d95926; --s3: #199e70;
      --seq-a: #9ec5f4; --seq-b: #86b6ef; --seq-c: #5598e7; --seq-d: #3987e5;
      --seq-e: #2a78d6; --seq-f: #256abf; --seq-g: #184f95;
      --up: #0ca30c; --down: #e66767; --warn: #fab219; --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0d0d0d; --surface: #1a1a19; --surface-2: #242422;
    --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --baseline: #383835; --border: rgba(255,255,255,0.10);
    --accent: #3987e5; --accent-soft: #10315c;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70;
    --seq-a: #9ec5f4; --seq-b: #86b6ef; --seq-c: #5598e7; --seq-d: #3987e5;
    --seq-e: #2a78d6; --seq-f: #256abf; --seq-g: #184f95;
    --up: #0ca30c; --down: #e66767; --warn: #fab219; --shadow: none;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 20px 72px; }

  h1, h2, h3, .fig { font-family: "Archivo", "IBM Plex Sans", system-ui, sans-serif; }
  h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
  h2 { font-size: 15px; font-weight: 700; margin: 0 0 2px; }
  h3 { font-size: 13px; font-weight: 700; margin: 0; }
  .sub { color: var(--ink-2); font-size: 13px; }

  header.bar { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: flex-end; justify-content: space-between; margin-bottom: 14px; }
  #brandName { color: var(--accent); }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  select, button.btn, input.goal {
    font: inherit; font-weight: 500; color: var(--ink);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 10px;
  }
  select, button.btn { cursor: pointer; }
  button.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.btn[disabled] { opacity: 0.5; cursor: default; }
  select:focus-visible, button:focus-visible, input:focus-visible, a:focus-visible, summary:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  nav.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--baseline); margin-bottom: 18px; overflow-x: auto; }
  nav.tabs button {
    font: inherit; font-weight: 600; font-size: 13.5px; color: var(--ink-2);
    background: none; border: none; border-bottom: 2px solid transparent;
    padding: 9px 14px; cursor: pointer; white-space: nowrap;
  }
  nav.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }

  section.block { margin-top: 22px; }
  .cards { display: grid; gap: 12px; }
  .kpis { grid-template-columns: repeat(auto-fit, minmax(148px, 1fr)); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; box-shadow: var(--shadow); }
  .kpi .lbl { font-size: 12px; color: var(--ink-2); }
  .kpi .fig { font-size: 24px; font-weight: 800; letter-spacing: -0.01em; line-height: 1.15; margin: 2px 0; }
  .delta { font-size: 12px; font-weight: 600; }
  .delta.up { color: var(--up); } .delta.down { color: var(--down); } .delta.flat { color: var(--muted); }

  .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .trio { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .multis { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
  @media (max-width: 820px) { .duo, .trio { grid-template-columns: 1fr; } }

  .chart-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); margin: 2px 0 8px; }
  .legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  svg text { font-family: "IBM Plex Sans", system-ui, sans-serif; }

  .tblwrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th { text-align: left; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted);
       padding: 6px 10px; border-bottom: 1px solid var(--baseline); white-space: nowrap; }
  td { padding: 7px 10px; border-bottom: 1px solid var(--grid); vertical-align: middle; white-space: nowrap; }
  tr:last-child td { border-bottom: none; }

  .tiercards { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }

  .analysis-sec p { max-width: 72ch; margin: 8px 0; }
  .goalrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 8px 0 4px; }

  .state-card { max-width: 640px; margin: 48px auto; }

  footer.pagefoot { margin-top: 28px; font-size: 12px; color: var(--muted); }
</style>

<div class="wrap">
  <div id="app"></div>
  <div id="tip" role="status"></div>
</div>

<script>
"use strict";
/* =====================================================================
   Affiliate Pulse — weekly TikTok Shop affiliate report for any brand
   on Euka. Four views: Last 30 Days, Week over Week (13 wks), Month
   over Month (6 mo), and Analysis. Reads the viewer's own Euka
   connector; stores nothing beyond local view preferences.
   ===================================================================== */

const T = {
  brands: "list_accessible_brands",
  overview: "get_dashboard_performance_overview",
  levels: "get_dashboard_creator_level_breakdown",
  topCreators: "get_dashboard_top_creators_by_gmv",
  topVideos: "get_dashboard_top_videos_by_revenue",
  funnel: "get_dashboard_creator_outreach_funnel",
  retention: "get_creator_retention_summary",
  ads: "get_dashboard_ads_overview",
};
const SEGMENTS = [
  { key: "emerging",    label: "Emerging",    range: "< $25K",       levels: ["L1","L2"],      colorVar: "--s1" },
  { key: "established", label: "Established", range: "$25K–$150K",   levels: ["L3","L4"],      colorVar: "--s2" },
  { key: "power",       label: "Power",       range: "$150K+",       levels: ["L5","L6","L7"], colorVar: "--s3" },
];
const SEQ = ["--seq-a","--seq-b","--seq-c","--seq-d","--seq-e","--seq-f","--seq-g"];
const RETENTION_BENCHMARK = 30, RETENTION_FLOOR = 28; /* % — monthly */

let mcp = null, SERVER = null, BRANDS = [];
const state = { brandId: null, tab: "d30", goal: null };
const memo = { d30: {}, weekly: {}, monthly: {} };   /* per-brand promise caches */

/* ---------------- utils ---------------- */
const $ = (sel, el) => (el || document).querySelector(sel);
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function store(key, val) { try { localStorage.setItem("ap." + key, JSON.stringify(val)); } catch (e) {} }
function recall(key) { try { const v = localStorage.getItem("ap." + key); return v == null ? null : JSON.parse(v); } catch (e) { return null; } }

function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function iso(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function fromIso(s) { const [y, m, dd] = s.split("-").map(Number); return new Date(y, m - 1, dd); }
function mdy(s) { const d = fromIso(s); return (d.getMonth() + 1) + "/" + d.getDate(); }
function nice(s) { return fromIso(s).toLocaleDateString(undefined, { month: "short", day: "numeric" }); }

/* Canonical windows — mirror of the weekly report methodology:
   attribution lag 2 days; 30d window; prior 30d; 13 Sun–Sat weeks; 6 months. */
function windows() {
  const gmvEnd = addDays(new Date(), -2);
  const gmvStart = addDays(gmvEnd, -29);
  const priorEnd = addDays(gmvStart, -1);
  const priorStart = addDays(priorEnd, -29);
  const weekEnd = addDays(gmvEnd, -((gmvEnd.getDay() + 1) % 7)); /* last Saturday ≤ gmvEnd */
  const weeks = [];
  for (let i = 12; i >= 0; i--) {
    const e = addDays(weekEnd, -7 * i);
    weeks.push({ start: iso(addDays(e, -6)), end: iso(e) });
  }
  const months = [];
  for (let i = 5; i >= 0; i--) {
    const first = new Date(gmvEnd.getFullYear(), gmvEnd.getMonth() - i, 1);
    const isCur = i === 0;
    const last = isCur ? gmvEnd : new Date(first.getFullYear(), first.getMonth() + 1, 0);
    months.push({ start: iso(first), end: iso(last),
      label: first.toLocaleDateString(undefined, { month: "short" }) + (isCur ? "*" : ""), partial: isCur });
  }
  return {
    cur: { start: iso(gmvStart), end: iso(gmvEnd) },
    prior: { start: iso(priorStart), end: iso(priorEnd) },
    weeks, months,
    thisWeek: weeks[weeks.length - 1],
  };
}

const fmtInt = n => n == null ? "—" : Math.round(n).toLocaleString();
function fmtMoney(n, compact) {
  if (n == null) return "—";
  if (compact && Math.abs(n) >= 10000)
    return "$" + (n / 1000).toLocaleString(undefined, { maximumFractionDigits: Math.abs(n) >= 100000 ? 0 : 1 }) + "K";
  return "$" + Math.round(n).toLocaleString();
}
const fmtNum = n => {
  if (n == null) return "—";
  if (Math.abs(n) >= 1e6) return (n / 1e6).toFixed(1) + "M";
  if (Math.abs(n) >= 1e4) return Math.round(n / 1e3) + "K";
  return Math.round(n).toLocaleString();
};
function pctChange(cur, prev) { return prev ? (cur - prev) / prev * 100 : null; }
function deltaHtml(pct, suffix) {
  if (pct == null || !isFinite(pct)) return '<span class="delta flat">—</span>';
  const cls = pct > 0.05 ? "up" : pct < -0.05 ? "down" : "flat";
  const arrow = cls === "up" ? "▲" : cls === "down" ? "▼" : "◦";
  return '<span class="delta ' + cls + '">' + arrow + " " + Math.abs(pct).toFixed(1) + "%" + (suffix || "") + "</span>";
}

async function call(tool, input, opts) {
  const options = Object.assign({ cache: { staleTime: 300000, gcTime: 86400000 } }, opts || {});
  try { return await mcp.callTool(SERVER, tool, input, options); }
  catch (e) {
    if (e && e.retryable) {
      await new Promise(r => setTimeout(r, (e.retryAfterMs || 900) + Math.random() * 600));
      return mcp.callTool(SERVER, tool, input, options);
    }
    throw e;
  }
}
async function pool(tasks, limit) {
  const results = new Array(tasks.length); let i = 0;
  async function worker() {
    while (i < tasks.length) {
      const idx = i++;
      try { results[idx] = { ok: true, val: await tasks[idx]() }; }
      catch (e) { results[idx] = { ok: false, err: e }; }
    }
  }
  await Promise.all(Array.from({ length: Math.min(limit, tasks.length) }, worker));
  return results;
}
const payloadOf = r => r && r.ok ? r.val.payload : null;

function errCopy(e) {
  const code = e && e.code;
  switch (code) {
    case "needs_reauth": return "Your Euka connection has expired. Reconnect it in claude.ai → Settings → Connectors, then reload this page.";
    case "server_not_connected": return "No Euka connector found. Add it in claude.ai → Settings → Connectors (see setup below).";
    case "selection_required": return "You have more than one connector with this name — pick one when claude.ai prompts you, or remove the duplicate, then reload.";
    case "not_in_manifest": return "This page isn't authorized for that Euka tool. Reload the page and accept the connector prompt.";
    case "blocked_by_policy": return "Your organization's policy blocks this Euka tool for your account.";
    case "approval_required": return "Your organization requires per-call approval for this tool, which artifacts can't request yet.";
    case "server_unavailable": return "Euka didn't respond. It may be briefly down — use Refresh to try again.";
    case "tool_error": return "Euka reported an error for this request" + (e.message ? ": " + e.message : ".");
    case "not_granted": case "capability_disabled": case "capability_removed":
      return "This view can't reach your connectors. Open the artifact directly in claude.ai and allow connector access when prompted.";
    default: return "This section couldn't load" + (e && e.message ? " (" + e.message + ")" : "") + ". Use Refresh to try again.";
  }
}
const errBox = (e, what) => '<div class="err"><b>' + esc(what) + ":</b> " + esc(errCopy(e)) + "</div>";

/* ---------------- tooltip ---------------- */
function bindTips(root) {
  root.querySelectorAll("[data-tip]").forEach(el => {
    el.addEventListener("mouseenter", () => { const t = $("#tip"); t.innerHTML = el.dataset.tip; t.style.display = "block"; });
    el.addEventListener("mousemove", ev => {
      const t = $("#tip"); const pad = 14;
      let x = ev.clientX + pad, y = ev.clientY + pad;
      const r = t.getBoundingClientRect();
      if (x + r.width > innerWidth - 8) x = ev.clientX - r.width - pad;
      if (y + r.height > innerHeight - 8) y = ev.clientY - r.height - pad;
      t.style.left = x + "px"; t.style.top = y + "px";
    });
    el.addEventListener("mouseleave", () => { $("#tip").style.display = "none"; });
  });
}

/* ---------------- SVG chart builders ---------------- */
function roundTopRect(x, y, w, h, r) {
  if (h <= 0) return "";
  r = Math.min(r, h, w / 2);
  return "M" + x + "," + (y + h) + " v" + (-(h - r)) + " q0,-" + r + " " + r + ",-" + r +
         " h" + (w - 2 * r) + " q" + r + ",0 " + r + "," + r + " v" + (h - r) + " z";
}
function gridLines(w, padL, padR, innerH, padT, steps) {
  let s = "";
  for (let i = 0; i <= steps; i++) {
    const y = padT + innerH - innerH * i / steps;
    s += '<line x1="' + padL + '" x2="' + (w - padR) + '" y1="' + y + '" y2="' + y +
         '" stroke="' + (i === 0 ? css("--baseline") : css("--grid")) + '" stroke-width="1"/>';
  }
  return s;
}
function barChart(labels, values, fmt, name) {
  const W = 460, H = 150, padL = 6, padR = 6, padT = 10, padB = 18;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const max = Math.max(1, ...values.filter(v => v != null));
  const n = labels.length, slot = innerW / n, bw = Math.max(6, Math.min(30, slot - 4));
  let bars = "", labs = "";
  const every = n > 8 ? 2 : 1;
  labels.forEach((lb, i) => {
    const x = padL + slot * i + (slot - bw) / 2, v = values[i];
    if (v != null) {
      const h = Math.max(v > 0 ? 2 : 0, innerH * v / max);
      bars += '<path d="' + roundTopRect(x, padT + innerH - h, bw, h, 4) + '" fill="' + css("--seq-e") + '"/>';
    } else bars += '<rect x="' + x + '" y="' + (padT + innerH - 2) + '" width="' + bw + '" height="2" fill="' + css("--grid") + '"/>';
    bars += '<rect x="' + (padL + slot * i) + '" y="' + padT + '" width="' + slot + '" height="' + innerH +
      '" fill="transparent" data-tip="<div class=\'t-head\'>' + lb + "</div>" + name + ": " + (v == null ? "unavailable" : fmt(v)) + '"/>';
    if (i % every === 0) labs += '<text x="' + (padL + slot * i + slot / 2) + '" y="' + (H - 4) +
      '" font-size="10" fill="' + css("--muted") + '" text-anchor="middle">' + lb + "</text>";
  });
  return '<svg viewBox="0 0 ' + W + " " + H + '" width="100%" role="img" aria-label="' + name + '">' +
         gridLines(W, padL, padR, innerH, padT, 2) + bars + labs + "</svg>";
}
function lineChart(labels, values, fmt, name, suffix) {
  const W = 460, H = 150, padL = 8, padR = 12, padT = 12, padB = 18;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const pts = values.filter(v => v != null);
  const max = Math.max(1, ...pts), min = Math.min(0, ...pts);
  const n = labels.length, slot = innerW / Math.max(1, n - 1);
  const xy = values.map((v, i) => v == null ? null : [padL + slot * i, padT + innerH - innerH * (v - min) / (max - min || 1)]);
  let path = "", started = false;
  xy.forEach(p => { if (!p) { started = false; return; } path += (started ? "L" : "M") + p[0] + "," + p[1]; started = true; });
  let dots = "", hits = "", labs = "";
  const every = n > 8 ? 2 : 1;
  xy.forEach((p, i) => {
    if (p) {
      const last = i === n - 1;
      dots += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="' + (last ? 4 : 2.5) + '" fill="' + css("--seq-e") + '"' +
        (last ? ' stroke="' + css("--surface") + '" stroke-width="2"' : "") + "/>";
    }
    hits += '<rect x="' + (padL + slot * i - slot / 2) + '" y="0" width="' + slot + '" height="' + H +
      '" fill="transparent" data-tip="<div class=\'t-head\'>' + labels[i] + "</div>" + name + ": " +
      (values[i] == null ? "unavailable" : fmt(values[i]) + (suffix || "")) + '"/>';
    if (i % every === 0) labs += '<text x="' + (padL + slot * i) + '" y="' + (H - 4) +
      '" font-size="10" fill="' + css("--muted") + '" text-anchor="middle">' + labels[i] + "</text>";
  });
  return '<svg viewBox="0 0 ' + W + " " + H + '" width="100%" role="img" aria-label="' + name + '">' +
         gridLines(W, padL, padR, innerH, padT, 2) +
         '<path d="' + path + '" fill="none" stroke="' + css("--seq-e") + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
         dots + hits + labs + "</svg>";
}
/* stacked 3-segment bars; fmt formats values (money or count) */
function stackedChart(labels, seriesArr, fmt, name) {
  const W = 560, H = 190, padL = 8, padR = 8, padT = 12, padB = 20;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const n = labels.length;
  const totals = labels.map((_, i) => seriesArr.reduce((a, s) => a + (s.values[i] || 0), 0));
  const max = Math.max(1, ...totals);
  const slot = innerW / n, bw = Math.max(8, Math.min(40, slot - 6));
  let out = "", labs = "";
  const every = n > 9 ? 2 : 1;
  labels.forEach((lb, i) => {
    const x = padL + slot * i + (slot - bw) / 2;
    let yCursor = padT + innerH;
    const parts = seriesArr.map(s => ({ label: s.label, v: s.values[i] || 0, color: css(s.colorVar) })).filter(p => p.v > 0);
    parts.forEach((p, idx) => {
      const h = Math.max(2, innerH * p.v / max) - (idx < parts.length - 1 ? 2 : 0);
      const isTop = idx === parts.length - 1;
      const y = yCursor - h;
      out += isTop ? '<path d="' + roundTopRect(x, y, bw, h, 4) + '" fill="' + p.color + '"/>'
                   : '<rect x="' + x + '" y="' + y + '" width="' + bw + '" height="' + h + '" fill="' + p.color + '"/>';
      yCursor = y - 2;
    });
    const rows = seriesArr.map(s => s.label + ": " + fmt(s.values[i] || 0)).join("<br>");
    out += '<rect x="' + (padL + slot * i) + '" y="' + padT + '" width="' + slot + '" height="' + innerH +
      '" fill="transparent" data-tip="<div class=\'t-head\'>' + lb + " · " + fmt(totals[i]) + "</div>" + rows + '"/>';
    if (i % every === 0) labs += '<text x="' + (padL + slot * i + slot / 2) + '" y="' + (H - 5) +
      '" font-size="10" fill="' + css("--muted") + '" text-anchor="middle">' + lb + "</text>";
  });
  return '<svg viewBox="0 0 ' + W + " " + H + '" width="100%" role="img" aria-label="' + name + '">' +
         gridLines(W, padL, padR, innerH, padT, 3) + out + labs + "</svg>";
}
const legendHtml = () => '<div class="legend">' + SEGMENTS.map(s =>
  '<span><span class="sw" style="background:var(' + s.colorVar + ')"></span>' + s.label + " (" + s.range + ")</span>").join("") + "</div>";

function segTotals(lv) {
  const bySeg = {};
  SEGMENTS.forEach(s => bySeg[s.key] = { gmv: 0, creators: 0, videos: 0, msgs: 0, sReq: 0, sApproved: 0, sDelivered: 0, sPosted: 0 });
  (lv && lv.tiers || []).forEach(t => {
    const seg = SEGMENTS.find(s => s.levels.includes(t.tier));
    if (!seg) return;
    const b = bySeg[seg.key];
    b.gmv += t.totalGmv || 0; b.creators += t.creators || 0; b.videos += t.videos || 0;
    b.msgs += t.invitesSent || 0; b.sReq += t.sampleRequests || 0; b.sApproved += t.samplesApproved || 0;
    b.sDelivered += t.samplesDelivered || 0; b.sPosted += t.samplesPosted || 0;
  });
  return bySeg;
}

/* ---------------- data loaders (memoized per brand) ---------------- */
function loadD30(brandId, fresh) {
  if (!fresh && memo.d30[brandId]) return memo.d30[brandId];
  const w = windows();
  const opts = fresh ? { cache: { staleTime: 0, gcTime: 86400000, refresh: true } } : undefined;
  memo.d30[brandId] = (async () => {
    const r = await pool([
      () => call(T.overview, { brandId, startDate: w.cur.start, endDate: w.cur.end }, opts),
      () => call(T.levels, { brandId, postedDateRange: w.cur }, opts),
      () => call(T.levels, { brandId, postedDateRange: w.prior }),
      () => call(T.ads, { brandId, postedDateRange: w.cur }, opts),
      () => call(T.funnel, { brandId, postedDateRange: w.cur }, opts),
      () => call(T.retention, { brandId, startDate: w.cur.start, endDate: w.cur.end }, opts),
      () => call(T.topCreators, { brandId, postedDateRange: w.cur, limit: 15 }, opts),
      () => call(T.topVideos, { brandId, filter: { postedDateRange: w.cur } }, opts),
      () => call(T.topCreators, { brandId, postedDateRange: w.thisWeek, limit: 10 }),
      () => call(T.overview, { brandId, startDate: w.thisWeek.start, endDate: w.thisWeek.end }),
    ], 4);
    return { w,
      overview: payloadOf(r[0]), overviewErr: r[0].ok ? null : r[0].err,
      levels: payloadOf(r[1]), levelsErr: r[1].ok ? null : r[1].err,
      levelsPrior: payloadOf(r[2]),
      ads: payloadOf(r[3]), adsErr: r[3].ok ? null : r[3].err,
      funnel: payloadOf(r[4]), funnelErr: r[4].ok ? null : r[4].err,
      retention: payloadOf(r[5]), retentionErr: r[5].ok ? null : r[5].err,
      topCreators: payloadOf(r[6]), topCreatorsErr: r[6].ok ? null : r[6].err,
      topVideos: payloadOf(r[7]), topVideosErr: r[7].ok ? null : r[7].err,
      weekTopCreators: payloadOf(r[8]),
      weekOverview: payloadOf(r[9]),
    };
  })();
  memo.d30[brandId].catch(() => { delete memo.d30[brandId]; });
  return memo.d30[brandId];
}
function loadPeriods(kind, brandId, fresh) {
  const bucket = memo[kind];
  if (!fresh && bucket[brandId]) return bucket[brandId];
  const w = windows();
  const periods = kind === "weekly" ? w.weeks : w.months;
  bucket[brandId] = (async () => {
    const tasks = [];
    periods.forEach((p, i) => {
      const isLast = i === periods.length - 1;
      const opts = (fresh && isLast) ? { cache: { staleTime: 0, gcTime: 86400000, refresh: true } } : undefined;
      tasks.push(() => call(T.overview, { brandId, startDate: p.start, endDate: p.end }, opts));
      tasks.push(() => call(T.levels, { brandId, postedDateRange: { start: p.start, end: p.end } }, opts));
      tasks.push(() => call(T.retention, { brandId, startDate: p.start, endDate: p.end }, opts));
    });
    const res = await pool(tasks, 4);
    const rows = periods.map((p, i) => ({
      period: p,
      label: kind === "weekly" ? mdy(p.end) : p.label,
      overview: payloadOf(res[i * 3]),
      levels: payloadOf(res[i * 3 + 1]),
      retention: payloadOf(res[i * 3 + 2]),
    }));
    const failed = res.filter(r => !r.ok);
    return { rows, failedCount: failed.length, firstErr: failed.length ? failed[0].err : null };
  })();
  bucket[brandId].catch(() => { delete bucket[brandId]; });
  return bucket[brandId];
}

  if (affs && affs.length) {
    const maxG = Math.max(1, ...affs.map(a => a.totalGmv || 0));
    s += '<div class="tblwrap"><table><thead><tr><th>Creator</th><th class="num">GMV</th><th></th><th class="num">Videos</th><th class="num">Δ GMV</th></tr></thead><tbody>' +
      affs.map(a => {
        const dl = a.revenueDelta;
        const dh = dl == null || !isFinite(dl) ? '<span class="delta flat">—</span>'
          : '<span class="delta ' + (dl >= 0 ? "up" : "down") + '">' + (dl >= 0 ? "▲" : "▼") + Math.abs(dl).toFixed(0) + "%</span>";
        return '<tr><td class="handle">@' + esc(a.handle) + '</td><td class="num">' + fmtMoney(a.totalGmv) +
          '</td><td style="min-width:76px"><span class="rankbar" style="width:' + Math.max(2, 72 * (a.totalGmv || 0) / maxG) + 'px"></span></td>' +
          '<td class="num">' + fmtInt(a.videoCount) + '</td><td class="num">' + dh + "</td></tr>";
      }).join("") + "</tbody></table></div>";
  } else s += crErr ? errBox(crErr, title) : '<div class="note">No creator GMV recorded.</div>';
  return s + "</div>";
}
function videosCard(vid, vidErr) {
  let s = '<div class="card"><div class="chart-head"><h2>Top videos by revenue</h2><span class="sub">posted in the last 30 days</span></div>';
  const vids = vid && vid.videos;
  if (vids && vids.length) {
    s += '<div class="tblwrap"><table><thead><tr><th>Creator / product</th><th class="num">Revenue</th><th class="num">Views</th>' +
      '<th class="num">Units</th><th class="num">Ad ROI</th><th class="num">Posted</th></tr></thead><tbody>' +
      vids.map(v =>
        '<tr><td><span class="handle">@' + esc(v.creatorHandle) + '</span><br><span class="sub">' +
        esc((v.productTitle || "").slice(0, 42)) + ((v.productTitle || "").length > 42 ? "…" : "") + "</span></td>" +
        '<td class="num">' + fmtMoney(v.revenue) + '</td><td class="num">' + fmtNum(v.viewsCount) +
        '</td><td class="num">' + fmtInt(v.itemsSoldCount) + '</td><td class="num">' +
        (v.gmvMaxCost ? (v.gmvMaxRoi != null ? v.gmvMaxRoi.toFixed(1) + "×" : "—") : "organic") +
        '</td><td class="num">' + (v.postedDate ? mdy(v.postedDate.slice(0, 10)) : "—") + "</td></tr>").join("") +
      "</tbody></table></div>";
  } else s += vidErr ? errBox(vidErr, "Top videos") : '<div class="note">No videos with revenue in this window.</div>';
  return s + "</div>";
}

/* ================= Weekly & Monthly ================= */
function periodsHtml(kind, d) {
  const rows = d.rows, labels = rows.map(r => r.label);
  const title = kind === "weekly" ? "13-week trend (Sun–Sat weeks)" : "6-month trend";
  const sub = kind === "weekly" ? "labels are week-ending dates" : "* = current partial month";
  const ov = f => rows.map(r => r.overview ? f(r.overview) : null);
  const segSeries = field => SEGMENTS.map(s => ({
    label: s.label, colorVar: s.colorVar,
    values: rows.map(r => r.levels ? segTotals(r.levels)[s.key][field] : 0),
  }));
  const ret = rows.map(r => r.retention && r.retention.current ? r.retention.current.retentionRate * 100 : null);
  const newCr = rows.map(r => r.retention && r.retention.current ? r.retention.current.newCreators : null);

  let html = '<section class="block"><div class="chart-head"><h2>' + title + '</h2><span class="sub">' + sub + "</span></div>";
  if (d.failedCount) html += '<div class="err"><b>Partial data:</b> ' + d.failedCount +
    " of the underlying reads failed (" + esc(errCopy(d.firstErr)) + ") — affected periods show as gaps or zeros.</div>";
  html += '<div class="multis">' +
    chartCard("Affiliate GMV", barChart(labels, ov(o => o.totalAffiliateGMV), x => fmtMoney(x, true), "Affiliate GMV")) +
    chartCard("Video views", barChart(labels, ov(o => o.allAccountVideoViews), fmtNum, "Views")) +
    chartCard("Videos posted", barChart(labels, ov(o => o.videoConvRateTotalVideos), fmtInt, "Videos")) +
    chartCard("Orders", barChart(labels, ov(o => o.totalOrders), fmtInt, "Orders")) +
    chartCard("Retention rate", lineChart(labels, ret, x => x.toFixed(1), "Retention", "%")) +
    chartCard("New creators", lineChart(labels, newCr, fmtInt, "New creators")) +
    "</div></section>";

  html += '<section class="block"><div class="chart-head"><h2>By creator segment</h2></div>' + legendHtml() +
    '<div class="multis">' +
    chartCard("GMV by segment", stackedChart(labels, segSeries("gmv"), x => fmtMoney(x, true), "GMV by segment")) +
    chartCard("Creators posting by segment", stackedChart(labels, segSeries("creators"), fmtInt, "Creators by segment")) +
    chartCard("Videos by segment", stackedChart(labels, segSeries("videos"), fmtInt, "Videos by segment")) +
    chartCard("Messages sent by segment", stackedChart(labels, segSeries("msgs"), fmtNum, "Messages by segment")) +
    chartCard("Samples delivered by segment", stackedChart(labels, segSeries("sDelivered"), fmtInt, "Samples by segment")) +
    chartCard("Samples posted by segment", stackedChart(labels, segSeries("sPosted"), fmtInt, "Samples posted by segment")) +
    "</div>" +
    '<div class="note">Segment GMV is attributed to videos posted in each period by that segment’s creators. New-creator counts come from the retention feed and are totals (Euka doesn’t expose them per level).</div></section>';
  return html;
}
const chartCard = (title, svg) => '<div class="card"><div class="eyebrow" style="margin-bottom:4px">' + title + "</div>" + svg + "</div>";

/* ================= Analysis ================= */
function analysisHtml(d30, wk, mo) {
  const secs = buildAnalysis(d30, wk, mo);
  let html = '<section class="block"><div class="chart-head"><h2>Analysis</h2>' +
    '<span class="sub">written from this report’s live numbers — anchored on the most recent complete week</span></div>' +
    '<div class="card"><div class="goalrow"><label for="goalIn"><b>Monthly GMV goal</b> (optional, powers the pacing line):</label>' +
    '<input class="goal" id="goalIn" type="number" min="0" step="1000" placeholder="e.g. 250000" value="' + (state.goal || "") + '">' +
    '<button class="btn" id="goalBtn">Save</button></div>' +
    (secs.pacing ? '<div style="margin-top:6px">' + secs.pacing + "</div>" : "") + "</div>";
  [["Performance", secs.performance], ["Creator highlights", secs.creators],
   ["Recruiting priorities", secs.recruiting], ["Growth outlook", secs.growth]].forEach(s => {
    html += '<div class="card analysis-sec"><h2>' + s[0] + "</h2>" + s[1].map(p => "<p>" + p + "</p>").join("") + "</div>";
  });
  html += '<div class="note">Generated deterministically from your Euka data at view time. For a written narrative that goes deeper, run the companion weekly-report skill in Claude with your Euka connector.</div></section>';
  return html;
}
function wireGoal() {
  const btn = $("#goalBtn"), inp = $("#goalIn");
  if (!btn) return;
  btn.addEventListener("click", () => {
    const v = Number(inp.value);
    state.goal = v > 0 ? v : null;
    store("goal." + state.brandId, state.goal);
    renderTab();
  });
}
function buildAnalysis(d30, wk, mo) {
  const out = { performance: [], creators: [], recruiting: [], growth: [], pacing: "" };
  const rows = wk.rows, last = rows[rows.length - 1];
  const lw = last && last.overview, lwl = last && last.levels, lwr = last && last.retention;
  const weekLbl = last ? "the week ending " + nice(last.period.end) : "this week";
  const gmvSeries = rows.map(r => r.overview ? r.overview.totalAffiliateGMV : null);
  const validG = gmvSeries.filter(v => v != null);

  /* --- Performance --- */
  if (lw) {
    const dir = lw.totalAffiliateGMVDifference;
    out.performance.push("<b>" + cap(weekLbl) + ":</b> affiliate GMV came in at <b>" + fmtMoney(lw.totalAffiliateGMV, true) +
      "</b> on " + fmtInt(lw.totalOrders) + " orders from " + fmtInt(lw.videoConvRateTotalVideos) + " videos — " +
      (dir == null ? "no prior week to compare." :
        dir >= 5 ? "up " + dir.toFixed(0) + "% week over week, a genuinely strong week." :
        dir <= -5 ? "down " + Math.abs(dir).toFixed(0) + "% week over week, worth understanding before reacting." :
        "roughly flat week over week (" + dir.toFixed(1) + "%).") );
    if (validG.length >= 5) {
      const trail = validG.slice(0, -1);
      const avg = trail.reduce((a, b) => a + b, 0) / trail.length;
      if (avg > 0) out.performance.push("Against the trailing " + trail.length + "-week average of " + fmtMoney(avg, true) +
        ", this week ran " + signedPct(lw.totalAffiliateGMV, avg) + ". " + momentumSentence(validG));
    }
    if (lw.allAccountVideoViewsDifference < -10 && lw.totalAffiliateGMVDifference > 0) {
      out.performance.push("Views fell " + Math.abs(lw.allAccountVideoViewsDifference).toFixed(0) +
        "% while GMV grew — read that as the creator mix shifting toward commercially-intent audiences, not a reach problem.");
    }
    const ads = d30.ads && d30.ads.adKpis;
    if (ads && ads.currentSpend) {
      const roi = ads.currentRevenue / ads.currentSpend;
      out.performance.push("Paid boosting over the last 30 days: " + fmtMoney(ads.currentSpend, true) + " spend, " +
        fmtMoney(ads.currentRevenue, true) + " attributed revenue, blended ROI <b>" + roi.toFixed(2) + "×</b>." +
        (roi < 2 ? " That ROI is thin — review targets before scaling spend." :
         roi > 3.5 ? " Note: pushing the ROI target much above ~3.5× tends to make the algorithm throttle spend within days, creating a GMV dip that looks organic but is a paid-ads setting." : ""));
    }
  } else out.performance.push("This week's totals couldn't be loaded — refresh to retry.");

  /* pacing vs goal */
  const curMonth = mo.rows[mo.rows.length - 1];
  if (curMonth && curMonth.overview) {
    const mtd = curMonth.overview.totalAffiliateGMV;
    const end = fromIso(curMonth.period.end), daysIn = end.getDate();
    const daysTotal = new Date(end.getFullYear(), end.getMonth() + 1, 0).getDate();
    const runRate = daysIn ? mtd / daysIn * daysTotal : null;
    let line = "<b>Month to date:</b> " + fmtMoney(mtd, true) + " affiliate GMV through " + nice(curMonth.period.end) +
      (runRate ? " — pacing to ~" + fmtMoney(runRate, true) + " for the month" : "") + ".";
    if (state.goal) {
      const pct = Math.min(100, 100 * mtd / state.goal);
      line += " Goal: " + fmtMoney(state.goal, true) + " → <b>" + pct.toFixed(0) + "%</b> there" +
        (runRate ? (runRate >= state.goal ? " and on track at the current run rate." :
          " but the current run rate lands ~" + fmtMoney(state.goal - runRate, true) + " short — the gap has to come from new posting volume or paid boosting.") : ".");
      line += '<div class="progress"><div style="width:' + pct + '%"></div></div>';
    }
    out.pacing = line;
    out.performance.push(line.replace(/<div class="progress".*$/, ""));
  }

  /* --- Creators --- */
  const tc = d30.weekTopCreators && d30.weekTopCreators.affiliates || [];
  if (tc.length) {
    const top = tc[0];
    out.creators.push("Top creator " + weekLbl.replace("the week", "for the week") + ": <b>@" + esc(top.handle) + "</b> with " +
      fmtMoney(top.totalGmv, true) + " across " + fmtInt(top.videoCount) + " video" + (top.videoCount === 1 ? "" : "s") +
      (top.revenueDelta != null && isFinite(top.revenueDelta) ? " (" + (top.revenueDelta >= 0 ? "up " : "down ") + Math.abs(top.revenueDelta).toFixed(0) + "% vs their prior week)" : "") + ".");
    const breakout = tc.find(a => a.revenueDelta != null && isFinite(a.revenueDelta) && a.revenueDelta > 100 && a.totalGmv > 500);
    if (breakout && breakout.handle !== top.handle)
      out.creators.push("Breakout to watch: <b>@" + esc(breakout.handle) + "</b> — " + fmtMoney(breakout.totalGmv, true) +
        " this week, up " + breakout.revenueDelta.toFixed(0) + "% on the week before. Ship them more product and get their content into paid boosting while it's hot.");
  } else out.creators.push("No creator drove attributable GMV this week — that itself is the headline if posting volume was normal.");
  if (lwl) {
    const segs = segTotals(lwl);
    const active = SEGMENTS.filter(s => segs[s.key].creators > 0);
    if (active.length) {
      const mostActive = active.reduce((a, s) => segs[s.key].videos > segs[a.key].videos ? s : a, active[0]);
      const mostProd = active.reduce((a, s) => perCreator(segs[s.key]) > perCreator(segs[a.key]) ? s : a, active[0]);
      out.creators.push("Segment picture this week: <b>" + mostActive.label + "</b> creators were the most active (" +
        fmtInt(segs[mostActive.key].videos) + " videos from " + fmtInt(segs[mostActive.key].creators) + " creators), while <b>" +
        mostProd.label + "</b> was the most productive per creator at " + fmtMoney(perCreator(segs[mostProd.key])) + "/creator." +
        (mostActive.key === "emerging" && mostProd.key === "power"
          ? " Classic shape: volume from the bottom, dollars from the top — the growth lever is activating more Power creators, not more posts per Emerging creator." : ""));
    }
  }

  /* --- Recruiting --- */
  const segs30 = d30.levels ? segTotals(d30.levels) : null;
  if (segs30) {
    const totMsgs = SEGMENTS.reduce((a, s) => a + segs30[s.key].msgs, 0);
    const totGmv = SEGMENTS.reduce((a, s) => a + segs30[s.key].gmv, 0);
    if (totMsgs && totGmv) {
      const rows = SEGMENTS.map(s => ({ s, msgShare: 100 * segs30[s.key].msgs / totMsgs, gmvShare: 100 * segs30[s.key].gmv / totGmv }));
      const mis = rows.reduce((a, r) => Math.abs(r.gmvShare - r.msgShare) > Math.abs(a.gmvShare - a.msgShare) ? r : a, rows[0]);
      out.recruiting.push("Outreach mix vs results (last 30 days): " + rows.map(r =>
        r.s.label + " gets " + r.msgShare.toFixed(0) + "% of messages and produces " + r.gmvShare.toFixed(0) + "% of GMV").join("; ") + "." +
        (Math.abs(mis.gmvShare - mis.msgShare) > 12
          ? " The biggest mismatch is <b>" + mis.s.label + "</b> — " + (mis.gmvShare > mis.msgShare
              ? "it over-delivers relative to the attention it gets; shift more messages and samples there."
              : "it absorbs more outreach than it returns; trim and reallocate upward.") : " The mix is broadly aligned with where GMV comes from."));
    }
    const samplesTotal = SEGMENTS.reduce((a, s) => a + segs30[s.key].sDelivered, 0);
    const postedTotal = SEGMENTS.reduce((a, s) => a + segs30[s.key].sPosted, 0);
    if (samplesTotal) out.recruiting.push("Sample-to-post: " + fmtInt(postedTotal) + " of " + fmtInt(samplesTotal) +
      " delivered samples have produced content (" + (100 * postedTotal / samplesTotal).toFixed(0) +
      "%). Chase the gap before shipping new units — a follow-up message to a sample-holder is the cheapest video you'll get.");
  }
  out.recruiting.push("Remember the lag: outreach sent today typically becomes posted content in 2–3 weeks and visible revenue in 5–8 weeks (posting lag plus the 5–10 day paid-boost learning phase). Judge this week's recruiting by what it seeds for next month, and credit this week's GMV to outreach from 4–6 weeks ago.");

  /* --- Growth --- */
  if (validG.length >= 6) {
    const firstHalf = avg(validG.slice(0, Math.floor(validG.length / 2)));
    const secondHalf = avg(validG.slice(Math.floor(validG.length / 2)));
    const trendPct = firstHalf ? (secondHalf - firstHalf) / firstHalf * 100 : null;
    const engine = dominantSegment(rows);
    out.growth.push("<b>13-week shape:</b> the back half of the window averages " + fmtMoney(secondHalf, true) + "/week vs " +
      fmtMoney(firstHalf, true) + " in the front half (" + (trendPct == null ? "n/a" : (trendPct >= 0 ? "+" : "") + trendPct.toFixed(0) + "%") + ")." +
      (engine ? " <b>" + engine.label + "</b> creators are the primary growth engine right now, carrying " + engine.share.toFixed(0) + "% of recent segment GMV." : ""));
    const last4 = validG.slice(-4), prior4 = validG.slice(-8, -4);
    if (last4.length === 4 && prior4.length === 4) {
      const m = avg(last4), p = avg(prior4);
      const proj = m * 4 * (p ? Math.max(0.6, Math.min(1.4, m / p)) : 1);
      out.growth.push("<b>4-week outlook:</b> the recent run rate of " + fmtMoney(m, true) + "/week projects roughly " + fmtMoney(proj, true) +
        " over the next four weeks if momentum holds. Upside: converting this month's sample recipients into posters and keeping paid ROI healthy pushes that higher. Downside: if retention stays " +
        retentionClause(d30) + " and top-creator concentration persists, one quiet creator-week takes a visible bite.");
    }
  }
  if (d30.retention && d30.retention.current) {
    const r = d30.retention.current.retentionRate * 100;
    out.growth.push("Retention over the 30-day window is <b>" + r.toFixed(1) + "%</b> — " +
      (r >= RETENTION_BENCHMARK ? "at or above the ~" + RETENTION_BENCHMARK + "% healthy benchmark." :
       r >= RETENTION_FLOOR ? "just under the ~" + RETENTION_BENCHMARK + "% benchmark; watch it, but the new-creator pipeline is covering churn." :
       "below the ~" + RETENTION_FLOOR + "% floor, which means churn is outrunning the pipeline's value — a reactivation pass on lapsed high-GMV creators should outrank net-new outreach this week."));
  }
  ["performance","creators","recruiting","growth"].forEach(k => { if (!out[k].length) out[k].push("Not enough data loaded to write this section — refresh to retry."); });
  return out;

  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function avg(a) { return a.reduce((x, y) => x + y, 0) / a.length; }
  function perCreator(b) { return b.creators ? b.gmv / b.creators : 0; }
  function signedPct(cur, base) { const p = (cur - base) / base * 100; return (p >= 0 ? "+" : "−") + Math.abs(p).toFixed(0) + "%"; }
  function momentumSentence(g) {
    const l3 = g.slice(-3);
    if (l3.length === 3 && l3[2] > l3[1] && l3[1] > l3[0]) return "That's three consecutive weeks of growth.";
    if (l3.length === 3 && l3[2] < l3[1] && l3[1] < l3[0]) return "That's three consecutive weeks of decline — check paid spend settings and top-creator posting before assuming demand softened.";
    return "";
  }
  function dominantSegment(rows) {
    const recent = rows.slice(-4);
    const tot = {}; let all = 0;
    SEGMENTS.forEach(s => tot[s.key] = 0);
    recent.forEach(r => { if (r.levels) { const sg = segTotals(r.levels); SEGMENTS.forEach(s => { tot[s.key] += sg[s.key].gmv; all += sg[s.key].gmv; }); } });
    if (!all) return null;
    const top = SEGMENTS.reduce((a, s) => tot[s.key] > tot[a.key] ? s : a, SEGMENTS[0]);
    return { label: top.label, share: 100 * tot[top.key] / all };
  }
  function retentionClause(d30) {
    const r = d30.retention && d30.retention.current ? d30.retention.current.retentionRate * 100 : null;
    return r == null ? "unknown" : r < RETENTION_FLOOR ? "below the healthy floor" : "around " + r.toFixed(0) + "%";
  }
}

/* ---------------- boot ---------------- */
async function boot() {
  $("#app").innerHTML = stateShell("Connecting…", '<div class="skel" style="min-height:60px"></div>');
  if (!window.claude || typeof window.claude.use !== "function") return showState("no-runtime");
  mcp = await claude.use("mcp");
  if (!mcp) return showState("no-runtime");
  let servers;
  try { servers = (await mcp.listTools()).servers || []; }
  catch (e) {
    if (e && (e.code === "not_granted" || e.code === "capability_disabled" || e.code === "capability_removed")) return showState("no-runtime");
    return showState("error", e);
  }
  const match = servers.find(s => s.tools && s.tools.length) || servers[0];
  if (!match) return showState("not-connected");
  if (match.authStatus === "needs_reauth") return showState("reauth", match.server);
  if (!match.tools || !match.tools.length) return showState("not-connected");
  SERVER = match.server;

  let brandsRes;
  try { brandsRes = await call(T.brands, {}); }
  catch (e) {
    if (e && e.code === "needs_reauth") return showState("reauth", SERVER);
    if (e && e.code === "server_not_connected") return showState("not-connected");
    return showState("error", e);
  }
  BRANDS = (brandsRes.payload && brandsRes.payload.result) || [];
  if (!BRANDS.length) return showState("error", { message: "Your Euka account has no accessible brands." });

  const remembered = recall("brand");
  state.brandId = BRANDS.some(b => b.brandId === remembered) ? remembered : BRANDS[0].brandId;
  state.goal = recall("goal." + state.brandId);

  $("#app").innerHTML = shellHtml();
  document.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", () => switchTab(b.dataset.tab)));
  const bs = $("#brandSel");
  if (bs) bs.addEventListener("change", () => {
    state.brandId = bs.value; store("brand", bs.value);
    state.goal = recall("goal." + state.brandId);
    $("#brandName").textContent = currentBrand().brandName;
    renderTab();
  });
  $("#refreshBtn").addEventListener("click", () => {
    delete memo.d30[state.brandId]; delete memo.weekly[state.brandId]; delete memo.monthly[state.brandId];
    renderTab(true);
  });
  renderTab();
}
boot();
</script>
